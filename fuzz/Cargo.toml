[package]
name = "thinws-fuzz"
version = "0.0.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
thinws-adapter-macos = { path = "../crates/thinws-adapter-macos" }
thinws-application = { path = "../crates/thinws-application" }
thinws-core = { path = "../crates/thinws-core" }
thinws-p0-cleanup = { path = "../experiments/p0/cleanup" }
thinws-p0-probe = { path = "../experiments/p0/probe" }

[[bin]]
name = "thinws_probe_path_validation"
path = "fuzz_targets/probe_path_validation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "thinws_materialize_layout_policy"
path = "fuzz_targets/materialize_layout_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "thinws_git_status"
path = "fuzz_targets/git_status.rs"
test = false
doc = false
bench = false

[[bin]]
name = "thinws_workspace_name"
path = "fuzz_targets/workspace_name.rs"
test = false
doc = false
bench = false

[[bin]]
name = "thinws_workspace_state"
path = "fuzz_targets/workspace_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "thinws_bootstrap_document"
path = "fuzz_targets/bootstrap_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "thinws_init_request"
path = "fuzz_targets/init_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "thinws_materialization_path"
path = "fuzz_targets/materialization_path.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
