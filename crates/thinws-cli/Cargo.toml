[package]
name = "thinws-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "thinws"
path = "src/main.rs"

[dependencies]
clap.workspace = true
directories.workspace = true
serde_json.workspace = true
thinws-adapter-git-cli = { path = "../thinws-adapter-git-cli" }
thinws-application = { path = "../thinws-application" }
thinws-metadata-sqlite = { path = "../thinws-metadata-sqlite" }

[target.'cfg(target_os = "macos")'.dependencies]
thinws-adapter-macos = { path = "../thinws-adapter-macos" }

[target.'cfg(target_os = "linux")'.dependencies]
thinws-adapter-linux = { path = "../thinws-adapter-linux" }

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
