name: P0 experiments

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Initialize experiment paths
        run: |
          test -d "$RUNNER_TEMP"
          printf 'THINWS_P0_CROSS_VOLUME_ROOT=%s/thinws-p0-cross-volume\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'THINWS_P0_IMAGE=%s/thinws-p0-cross-volume.dmg\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Format
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Lint
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Prepare distinct APFS volume
        id: cross-volume
        run: |
          hdiutil create -size 128m -fs APFS -volname thinws-p0-ci "$THINWS_P0_IMAGE"
          hdiutil attach -nobrowse -owners on -mountpoint "$THINWS_P0_CROSS_VOLUME_ROOT" "$THINWS_P0_IMAGE"
      - name: Tests on actual macOS filesystem
        run: cargo test --locked --workspace --all-targets -- --include-ignored
      - name: Release tests
        run: cargo test --locked --release --workspace --all-targets -- --include-ignored
      - name: Load pinned quality tools
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          pins = tomllib.loads(Path('tools/quality-tools.toml').read_text())['tools']
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in pins.items():
                  output.write(f'THINWS_{key.upper()}={value}\n')
          PY
      - name: Install quality tools
        run: |
          cargo install --locked cargo-mutants --version "$THINWS_CARGO_MUTANTS"
          cargo install --locked cargo-fuzz --version "$THINWS_CARGO_FUZZ"
          cargo install --locked cargo-deny --version "$THINWS_CARGO_DENY"
          cargo install --locked cargo-audit --version "$THINWS_CARGO_AUDIT"
          rustup toolchain install "$THINWS_FUZZ_NIGHTLY" --profile minimal --component rust-src
      - name: Dependency policy and advisories for both workspaces
        run: |
          cargo deny --locked check
          cargo deny --locked --manifest-path fuzz/Cargo.toml --config deny.toml check
          cargo audit --deny warnings --file Cargo.lock
          cargo audit --deny warnings --file fuzz/Cargo.lock
      - name: Full experiment mutation tests
        run: cargo mutants --workspace --timeout 60 --jobs 2 --output target -- -- --include-ignored
      - name: Path fuzz smoke
        run: cargo +"$THINWS_FUZZ_NIGHTLY" fuzz run thinws_probe_path_validation -- -max_total_time=60 -timeout=5 -max_len=4096 -print_final_stats=1
      - name: Detach experiment volume
        if: always() && steps.cross-volume.outcome == 'success'
        run: |
          set -u

          expected_mountpoint="$RUNNER_TEMP/thinws-p0-cross-volume"
          if [ "$THINWS_P0_CROSS_VOLUME_ROOT" != "$expected_mountpoint" ]; then
            printf 'refusing to detach unexpected path: %s\n' "$THINWS_P0_CROSS_VOLUME_ROOT" >&2
            exit 64
          fi

          attempt=1
          max_attempts=5
          retry_delay=1
          while :; do
            if hdiutil detach "$THINWS_P0_CROSS_VOLUME_ROOT"; then
              exit 0
            else
              status=$?
            fi

            if [ "$status" -ne 16 ]; then
              printf 'hdiutil detach failed without a retryable busy error (exit %s)\n' "$status" >&2
              exit "$status"
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              printf 'hdiutil detach remained busy after %s attempts\n' "$attempt" >&2
              exit "$status"
            fi

            printf 'hdiutil detach was busy on attempt %s/%s; retrying in %s second(s)\n' \
              "$attempt" "$max_attempts" "$retry_delay" >&2
            sleep "$retry_delay"
            attempt=$((attempt + 1))
            retry_delay=$((retry_delay * 2))
          done
