[workspace]
members = [
    "crates/thinws-core",
    "experiments/p0/cleanup",
    "experiments/p0/materialize",
    "experiments/p0/probe",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
rust-version = "1.97.1"

[workspace.dependencies]
thiserror = "2"
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
