[package]
name = "thinws-p0-probe-fuzz"
version = "0.0.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
thinws-p0-cleanup = { path = "../experiments/p0/cleanup" }
thinws-p0-probe = { path = "../experiments/p0/probe" }

[[bin]]
name = "thinws_probe_path_validation"
path = "fuzz_targets/probe_path_validation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "thinws_materialize_layout_policy"
path = "fuzz_targets/materialize_layout_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "thinws_git_status"
path = "fuzz_targets/git_status.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
