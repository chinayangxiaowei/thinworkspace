[workspace]
members = [
    "crates/thinws-adapter-git-cli",
    "crates/thinws-adapter-macos",
    "crates/thinws-application",
    "crates/thinws-cli",
    "crates/thinws-core",
    "crates/thinws-metadata-sqlite",
    "crates/thinws-ports",
    "experiments/p0/cleanup",
    "experiments/p0/linux-reflink",
    "experiments/p0/materialize",
    "experiments/p0/probe",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
rust-version = "1.97.1"

[workspace.dependencies]
blake3 = "1.8.7"
clap = { version = "4.5.58", features = ["derive"] }
directories = "6.0.0"
libc = "0.2"
rusqlite = { version = "0.40.0", default-features = false, features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27"
thiserror = "2"
toml = "1.0"
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
