name: P0 experiments

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    # P0-07 run 34760370580 hit the 60-minute job limit during 712 mutations.
    # Allow the expanded suite to finish without reducing any gate or test budget.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Initialize experiment paths
        run: |
          test -d "$RUNNER_TEMP"
          printf 'THINWS_P0_SUBMOUNT_SOURCE=%s/thinws-p0-submount-source\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'THINWS_P0_CROSS_VOLUME_ROOT=%s/thinws-p0-submount-source/mounted\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'THINWS_P0_IMAGE=%s/thinws-p0-cross-volume.dmg\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Format
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Test CI helpers
        run: python3 -B -m unittest tools/test_ci_detach_image.py
      - name: Lint
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Prepare distinct APFS volume
        id: cross-volume
        run: |
          mkdir "$THINWS_P0_SUBMOUNT_SOURCE"
          hdiutil create -size 128m -fs APFS -volname thinws-p0-ci "$THINWS_P0_IMAGE"
          hdiutil attach -nobrowse -owners on -mountpoint "$THINWS_P0_CROSS_VOLUME_ROOT" "$THINWS_P0_IMAGE"
      - name: Tests on actual macOS filesystem
        run: cargo test --locked --workspace --all-targets -- --include-ignored --nocapture
      - name: Release tests
        run: cargo test --locked --release --workspace --all-targets -- --include-ignored --nocapture
      - name: Load pinned quality tools
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          pins = tomllib.loads(Path('tools/quality-tools.toml').read_text())['tools']
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in pins.items():
                  output.write(f'THINWS_{key.upper()}={value}\n')
          PY
      - name: Install quality tools
        run: |
          cargo install --locked cargo-mutants --version "$THINWS_CARGO_MUTANTS"
          cargo install --locked cargo-fuzz --version "$THINWS_CARGO_FUZZ"
          cargo install --locked cargo-deny --version "$THINWS_CARGO_DENY"
          cargo install --locked cargo-audit --version "$THINWS_CARGO_AUDIT"
          rustup toolchain install "$THINWS_FUZZ_NIGHTLY" --profile minimal --component rust-src
      - name: Dependency policy and advisories for both workspaces
        run: |
          cargo deny --locked check
          cargo deny --locked --manifest-path fuzz/Cargo.toml --config deny.toml check
          cargo audit --deny warnings --file Cargo.lock
          cargo audit --deny warnings --file fuzz/Cargo.lock
      - name: Full experiment mutation tests
        # Preserve fixtures whose cleanup stopped; scratch teardown must not delete them.
        run: cargo mutants --workspace --leak-dirs --timeout 60 --jobs 2 --output target -- -- --include-ignored --nocapture
      - name: Path fuzz smoke
        run: cargo +"$THINWS_FUZZ_NIGHTLY" fuzz run thinws_probe_path_validation -- -max_total_time=60 -timeout=5 -max_len=4096 -print_final_stats=1
      - name: Materialization layout policy fuzz smoke
        run: cargo +"$THINWS_FUZZ_NIGHTLY" fuzz run thinws_materialize_layout_policy -- -max_total_time=60 -timeout=5 -max_len=4096 -print_final_stats=1
      - name: Git status and cleanup policy fuzz smoke
        run: cargo +"$THINWS_FUZZ_NIGHTLY" fuzz run thinws_git_status -- -max_total_time=60 -timeout=5 -max_len=4096 -print_final_stats=1
      - name: Detach experiment volume
        if: always() && steps.cross-volume.outcome == 'success'
        run: >-
          python3 -B tools/ci_detach_image.py
          --image "$THINWS_P0_IMAGE"
          --runner-temp "$RUNNER_TEMP"
